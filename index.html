<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e6e0d0">
<title>Chess Online — Two Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <h1 class="title">Chess Online</h1>
    <div class="header-row">
      <div id="status" class="status"></div>
      <span id="connectionLabel" class="connection">offline</span>
    </div>
  </header>

  <main id="main">
    <div id="board-wrap">
      <div id="board" class="board"></div>
      <div id="hint" class="hint"></div>
    </div>

    <aside id="side">
      <div class="card">
        <div class="card-title">Room</div>
        <div class="room-row">
          <input id="roomInput" class="room-input" type="text" maxlength="8"
                 placeholder="code" aria-label="Room code">
          <button id="joinBtn" class="btn btn-secondary" type="button">Join</button>
        </div>
        <div id="shareRow" class="share-row" hidden>
          <input id="shareLink" class="room-input" type="text" readonly aria-label="Share link">
          <button id="copyBtn" class="btn btn-secondary" type="button">Copy</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Moves</div>
        <ul id="movesList" class="moves-list"></ul>
      </div>

      <div class="card">
        <div class="card-title">Game</div>
        <div class="controls">
          <button id="newGameBtn" class="btn btn-primary" type="button">New Game</button>
          <button id="flipBtn" class="btn btn-secondary" type="button">Flip Board</button>
          <button id="hotseatBtn" class="btn btn-secondary" type="button">Hot-Seat (2 players)</button>
        </div>
        <div class="controls">
          <button id="resignBtn" class="btn btn-danger" type="button" hidden>Resign</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="promotionOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-title" id="promotionTitle"></div>
      <div class="promo-grid">
        <button class="promo-btn" type="button" data-piece="q">Queen</button>
        <button class="promo-btn" type="button" data-piece="r">Rook</button>
        <button class="promo-btn" type="button" data-piece="b">Bishop</button>
        <button class="promo-btn" type="button" data-piece="n">Knight</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Chess piece glyphs (stroke-only geometry; fill/stroke set via .pc-white / .pc-black) -->
  <svg style="display: none;" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="sym-p-white" viewBox="0 0 40 40">
        <circle cx="20" cy="9" r="7.5"/>
        <path d="M20 16 v5"/>
        <path d="M13 25 h14"/>
        <path d="M20 22 v4"/>
        <circle cx="20" cy="30" r="4"/>
      </symbol>
      <symbol id="sym-n-white" viewBox="0 0 40 40">
        <path d="M8 30 L8 14 L12 8 L18 4 L24 6 L28 4 L32 8 L30 14 L24 12 L18 16 L14 14 L10 20 L14 26 Z"/>
      </symbol>
      <symbol id="sym-b-white" viewBox="0 0 40 40">
        <path d="M20 6 L14 18 L20 16 L26 18 Z"/>
        <rect x="13" y="18" width="14" height="2.5"/>
        <path d="M15 19 h10"/>
        <path d="M20 19 v5"/>
        <circle cx="20" cy="27" r="5.5"/>
        <rect x="17.5" y="33" width="5" height="2.5"/>
      </symbol>
      <symbol id="sym-r-white" viewBox="0 0 40 40">
        <rect x="10" y="26.5" width="20" height="2.5"/>
        <rect x="12" y="21" width="16" height="2.5"/>
        <rect x="10" y="15.5" width="20" height="2.5"/>
        <rect x="5.5" y="11" width="2.5" height="5"/>
        <rect x="10" y="11" width="2.5" height="5"/>
        <rect x="18.5" y="11" width="2.5" height="5"/>
        <rect x="27.5" y="11" width="2.5" height="5"/>
        <path d="M20 11 v5"/>
      </symbol>
      <symbol id="sym-q-white" viewBox="0 0 40 40">
        <polygon points="20 8 16.5 15 18.5 10.5 15 6 19 9.5 22 6 23.5 10.5 21.5 15"/>
        <rect x="13" y="16" width="14" height="2.5"/>
        <path d="M20 18 v5"/>
        <circle cx="20" cy="25" r="5.5"/>
        <rect x="17.5" y="31" width="5" height="2.5"/>
      </symbol>
      <symbol id="sym-k-white" viewBox="0 0 40 40">
        <path d="M20 4 L20 6"/>
        <path d="M18 6 h4"/>
        <path d="M18 10 v4"/>
        <rect x="13" y="14" width="14" height="2.5"/>
        <path d="M20 16 v5"/>
        <circle cx="20" cy="23" r="5"/>
        <rect x="17.5" y="29" width="5" height="2.5"/>
      </symbol>
      <symbol id="sym-p-black" viewBox="0 0 40 40">
        <circle cx="20" cy="9" r="7.5"/>
        <path d="M20 16 v5"/>
        <path d="M13 25 h14"/>
        <path d="M20 22 v4"/>
        <circle cx="20" cy="30" r="4"/>
      </symbol>
      <symbol id="sym-n-black" viewBox="0 0 40 40">
        <path d="M8 30 L8 14 L12 8 L18 4 L24 6 L28 4 L32 8 L30 14 L24 12 L18 16 L14 14 L10 20 L14 26 Z"/>
      </symbol>
      <symbol id="sym-b-black" viewBox="0 0 40 40">
        <path d="M20 6 L14 18 L20 16 L26 18 Z"/>
        <rect x="13" y="18" width="14" height="2.5"/>
        <path d="M15 19 h10"/>
        <path d="M20 19 v5"/>
        <circle cx="20" cy="27" r="5.5"/>
        <rect x="17.5" y="33" width="5" height="2.5"/>
      </symbol>
      <symbol id="sym-r-black" viewBox="0 0 40 40">
        <rect x="10" y="26.5" width="20" height="2.5"/>
        <rect x="12" y="21" width="16" height="2.5"/>
        <rect x="10" y="15.5" width="20" height="2.5"/>
        <rect x="5.5" y="11" width="2.5" height="5"/>
        <rect x="10" y="11" width="2.5" height="5"/>
        <rect x="18.5" y="11" width="2.5" height="5"/>
        <rect x="27.5" y="11" width="2.5" height="5"/>
        <path d="M20 11 v5"/>
      </symbol>
      <symbol id="sym-q-black" viewBox="0 0 40 40">
        <polygon points="20 8 16.5 15 18.5 10.5 15 6 19 9.5 22 6 23.5 10.5 21.5 15"/>
        <rect x="13" y="16" width="14" height="2.5"/>
        <path d="M20 18 v5"/>
        <circle cx="20" cy="25" r="5.5"/>
        <rect x="17.5" y="31" width="5" height="2.5"/>
      </symbol>
      <symbol id="sym-k-black" viewBox="0 0 40 40">
        <path d="M20 4 L20 6"/>
        <path d="M18 6 h4"/>
        <path d="M18 10 v4"/>
        <rect x="13" y="14" width="14" height="2.5"/>
        <path d="M20 16 v5"/>
        <circle cx="20" cy="23" r="5"/>
        <rect x="17.5" y="29" width="5" height="2.5"/>
      </symbol>
    </defs>
  </svg>

  <script src="chess-logic.js"></script>
  <script src="game.js"></script>
</div>
</body>
</html>
